# Litestream v0.5 の設定。${VAR} は起動時に環境変数で置き換えられる
logging:
  level: info
  type: json

# 24 時間ごとにスナップショットを取り、7 日分を保持する（この範囲で任意の時点に戻せる）
snapshot:
  interval: 24h
  retention: 168h

dbs:
  - path: ${DATABASE_PATH}
    replica:
      # 本番: s3://<bucket>/<path>（OCI Object Storage）、ローカル検証: file:///replica
      url: ${LITESTREAM_REPLICA_URL}
      # A1 が突然失われたときに失うのは最大 1 時間分にする（停止時は最終同期するため失わない）
      sync-interval: 1h
      # OCI では https://<namespace>.compat.objectstorage.ap-osaka-1.oraclecloud.com と ap-osaka-1。
      # 認証情報（Customer Secret Key）は LITESTREAM_ACCESS_KEY_ID / LITESTREAM_SECRET_ACCESS_KEY から読まれる
      endpoint: ${LITESTREAM_S3_ENDPOINT}
      region: ${LITESTREAM_S3_REGION}
