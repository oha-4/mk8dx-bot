name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, format, typecheck, test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .node-version の node を入れ、package-lock.json をキーに ~/.npm をキャッシュする
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  image:
    name: Build and push image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    concurrency:
      group: image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io/oha-4/mk8dx-bot は Python 版と共有している。Python 版が参照する latest は公開しない（spec: deployment）
      #   edge: main の最新コミット / <sha>: コミットごと（Python 版と同じ full SHA）
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/oha-4/mk8dx-bot
          flavor: |
            latest=false
          tags: |
            type=edge,branch=main
            type=sha,prefix=,format=long

      # labels は渡さない。org.opencontainers.image.source は GHCR のパッケージとリポジトリの紐づけに使われ、
      # Python 版に紐づいた既存パッケージへの影響を確認していないため
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=mk8dx-bot-ts
          cache-to: type=gha,mode=max,scope=mk8dx-bot-ts
