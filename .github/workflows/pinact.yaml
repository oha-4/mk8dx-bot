name: pinact

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/pinact.yaml'
      - 'mise.toml'
      - 'mise.ci.toml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/pinact.yaml'
      - 'mise.toml'
      - 'mise.ci.toml'

permissions:
  contents: read

jobs:
  pinact:
    name: Verify actions are pinned
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # reviewdog で PR に違反箇所をコメントする
      pull-requests: write
    env:
      MISE_ENV: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pinact と reviewdog を mise.toml / mise.ci.toml のバージョンで使う
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: pinact aqua:reviewdog/reviewdog

      - uses: suzuki-shunsuke/pinact-action@2a42f29b3397967439ed46e7650f3045f49699f9 # v3.0.1
        with:
          fix: 'false'
          verify: 'true'
          review: ${{ github.event_name == 'pull_request' }}
          github_token: ${{ github.token }}
          config: .github/pinact.yaml
